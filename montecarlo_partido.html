<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Montecarlo · Análisis de partido</title>
<style>
:root{--navy:#071b32;--red:#ff0046;--bg:#f3f5f7;--ink:#183651;--muted:#71869c;--line:#dde5ec;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Arial,sans-serif;color:var(--ink)}header{height:58px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 max(16px,calc((100% - 1120px)/2));gap:20px}.brand{font-size:19px;font-weight:800}.brand b{color:var(--red)}a{color:#bcd5eb;text-decoration:none}.wrap{max-width:1120px;margin:24px auto;padding:0 16px}.back{font-size:12px;color:#496a87;cursor:pointer}.hero{margin:16px 0;background:var(--navy);border-radius:7px;color:#fff;padding:23px}.hero h1{margin:0 0 8px;font-size:25px}.sub{color:#bdd0e1}.notice{background:#e8f3fe;border:1px solid #c9e2f9;color:#285c8d;border-radius:5px;padding:12px;margin-bottom:16px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:16px}.card h2{font-size:12px;color:#637b92;margin:0 0 14px;letter-spacing:.4px;text-transform:uppercase}.wide{grid-column:span 3}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.metrics{display:grid;gap:9px}.metric{display:flex;justify-content:space-between;border-bottom:1px solid #edf1f4;padding-bottom:7px;font-size:13px}.metric:last-child{border:0;padding:0}.metric span{color:var(--muted)}.big{font-size:25px;font-weight:800}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px 6px;text-align:right;border-bottom:1px solid #edf1f4}.table th:first-child,.table td:first-child{text-align:left}.table th{font-size:11px;color:var(--muted)}.pill{padding:5px 8px;border-radius:99px;background:#f2f6f9;font-size:11px;color:#546f88}.live{color:#c90038;background:#fff0f3}.upcoming{color:#35628a;background:#edf6fd}.finished{color:#486278;background:#eff3f6}.loading{padding:35px;text-align:center;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}.wide{grid-column:span 1}.two{grid-template-columns:1fr}.hero h1{font-size:20px}}
</style></head><body><header><div class="brand">MONTE<b>CARLO</b></div><div>Análisis predictivo con datos reales</div></header><main class="wrap"><a class="back" href="montecarlo_flashscore.html">← Volver al calendario</a><section id="root" class="loading">Cargando históricos publicados del partido…</section></main>
<script>
const network=location.pathname.split('/')[2],id=new URLSearchParams(location.search).get('match_id');
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>v==null?'—':Number(v).toFixed(2); const p=v=>v==null?'—':Number(v).toFixed(2)+'%';
let refreshTimer=null;
const liveMarkup=live=>{const label=live.status==='live'?'EN DIRECTO':live.status==='finished'?'FINALIZADO':'PRÓXIMO';const minute=live.minute!=null?' · '+esc(live.minute)+"'":'';const h=live.home||{},a=live.away||{},hs=h.stats||{},as=a.stats||{},m=live.market_1x2||{};return `\<section class="wide card"\>\<h2\>Actualización de partido \<span class="pill ${esc(live.status||'upcoming')}"\>${label}${minute}\</span\>\</h2\>\<div class="two"\>\<div class="metrics"\>\<div class="metric"\>\<span\>${esc(h.name||'Local')}\</span\>\<b\>${n(hs.goals)} goles · xG ${n(hs.xg)} · ${n(hs.corners)} córners · ${n(hs.shots_on_target)} remates a puerta\</b\>\</div\>\<div class="metric"\>\<span\>${esc(a.name||'Visitante')}\</span\>\<b\>${n(as.goals)} goles · xG ${n(as.xg)} · ${n(as.corners)} córners · ${n(as.shots_on_target)} remates a puerta\</b\>\</div\>\</div\>\<div class="metrics"\>\<div class="metric"\>\<span\>Cuotas 1X2 actuales\</span\>\<b\>${m.odds?`${n(m.odds.home)} / ${n(m.odds.draw)} / ${n(m.odds.away)}`:'—'}\</b\>\</div\>\<div class="metric"\>\<span\>Proveedor / actualización\</span\>\<b\>${esc(m.bookmaker||'No publicado')} · ${esc(new Date(live.fetched_at).toLocaleTimeString('es-ES',{timeZone:'UTC'}))} UTC\</b\>\</div\>\</div\>\</div\>\<p style="margin:13px 0 0;color:#71869c;font-size:11px"\>${live.status==='live'?'Se refresca cada 60 segundos mientras esta pestaña permanezca abierta.':'Próxima revisión automática en 10 minutos mientras la ficha permanezca abierta.'} Estadísticas y cuotas ausentes se muestran como — porque TheStatsAPI no las publicó.\</p\>\</section\>`};
async function refreshLive(){try{const live=await call('actualizar_partido_en_vivo',{match_id:id});const target=document.getElementById('liveData');if(target)target.innerHTML=liveMarkup(live);clearTimeout(refreshTimer);if(live.status!=='finished')refreshTimer=setTimeout(refreshLive,live.status==='live'?60000:600000)}catch(e){const target=document.getElementById('liveData');if(target)target.innerHTML='\<div class="notice"\>No se pudo actualizar el estado en directo: '+esc(e.message)+'\</div\>';}}
async function call(action,params){const r=await fetch(`/api/core/v1/networks/${encodeURIComponent(network)}/boards/montecarlo_orchestrator/actions/${action}`,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(params)});const d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.error||'No se pudo consultar el nodo');return d?.data||d?.result||d}
const metric=(label,value,unit='')=>`<div class="metric"><span>${label}</span><b>${value==null?'—':n(value)+unit}</b></div>`;
const sideTable=(title,side)=>`<div class="card"><h2>${esc(title)} · últimos ${side.matches_used} finalizados</h2><div class="metrics">${metric('Goles a favor',side.goals_for_avg)}${metric('Goles en contra',side.goals_against_avg)}${metric('xG a favor',side.xg_for_avg)}${metric('xG en contra',side.xg_against_avg)}${metric('Córners a favor',side.corners_for_avg)}${metric('Remates al arco',side.shots_on_target_for_avg)}${metric('BTTS histórico',side.btts_percent,'%')}${metric('Over 2.5 histórico',side.over_2_5_percent,'%')}</div></div>`;
async function run(){if(!id){root.innerHTML='<div class="notice">Falta el identificador del partido.</div>';return}try{const [t,market,live]=await Promise.all([call('analizar_tendencias_partido',{match_id:id}),call('proyectar_partido',{match_id:id}),call('actualizar_partido_en_vivo',{match_id:id})]);const h=t.match.home,a=t.match.away,e=t.estimate, mh=market.market_1x2_percent||{}, mu=market.over_under_2_5_percent||{};root.innerHTML=`<section class="hero"><h1>${esc(h.name)} <span style="color:#92afc6">vs</span> ${esc(a.name)}</h1><div class="sub">${esc(t.match.kickoff||'Hora no publicada')} · Ficha calculada a partir de eventos pasados publicados</div></section><div class="notice">${esc(t.methodology)} No se sustituyen campos ausentes con ceros ni datos estimados inventados.</div><div id="liveData">${liveMarkup(live)}</div><section class="grid"><div class="card"><h2>1X2 · mercado publicado</h2><div class="metrics">${metric('Victoria local',mh.home,'%')}${metric('Empate',mh.draw,'%')}${metric('Victoria visitante',mh.away,'%')}</div></div><div class="card"><h2>Estimación xG emparejada</h2><div class="metrics">${metric(h.name,e.lambda_home_xg)}${metric(a.name,e.lambda_away_xg)}<div class="metric"><span>Fuente</span><b>últimos 5 xG</b></div></div></div><div class="card"><h2>Tendencias de goles</h2><div class="metrics">${metric('BTTS sí (tendencia)',e.btts_percent,'%')}${metric('Over 2.5 (tendencia)',e.over_2_5_percent,'%')}${metric('Over 2.5 (mercado)',mu.over_2_5,'%')}</div></div><div class="wide two">${sideTable(h.name,t.recent_form.home)}${sideTable(a.name,t.recent_form.away)}</div><div class="card"><h2>Córners estimados</h2><div class="metrics">${metric(h.name,e.expected_corners_home)}${metric(a.name,e.expected_corners_away)}<div class="metric"><span>Total orientativo</span><b>${e.expected_corners_home!=null&&e.expected_corners_away!=null?n(e.expected_corners_home+e.expected_corners_away):'—'}</b></div></div></div><div class="card"><h2>Remates al arco estimados</h2><div class="metrics">${metric(h.name,e.expected_shots_on_target_home)}${metric(a.name,e.expected_shots_on_target_away)}<div class="metric"><span>Total orientativo</span><b>${e.expected_shots_on_target_home!=null&&e.expected_shots_on_target_away!=null?n(e.expected_shots_on_target_home+e.expected_shots_on_target_away):'—'}</b></div></div></div><div class="card"><h2>Head to head</h2><div class="metrics"><div class="metric"><span>Partidos encontrados</span><b>${t.head_to_head.matches_used}</b></div>${metric('BTTS H2H',t.head_to_head.home.btts_percent,'%')}${metric('Over 2.5 H2H',t.head_to_head.home.over_2_5_percent,'%')}</div></div><div class="wide card"><h2>Lectura del modelo</h2><p style="margin:0;color:#546f88;line-height:1.55">Las estimaciones de xG, córners y remates combinan el promedio ofensivo de un equipo con el promedio concedido por su rival, usando exclusivamente sus cinco encuentros finalizados más recientes. BTTS y Over 2.5 son frecuencias históricas emparejadas; H2H se muestra por separado para que no altere silenciosamente el modelo. La caché dura seis horas y evita volver a consultar o recalcular al abrir este partido.</p></div></section>`;if(live.status!=='finished'){clearTimeout(refreshTimer);refreshTimer=setTimeout(refreshLive,live.status==='live'?60000:600000)}}catch(err){root.innerHTML=`<div class="notice">No se pudo cargar el análisis: ${esc(err.message)}</div>`}}
run();
</script></body></html>
